<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-4 offset-4">
                <form id="todoForm">
                    <div class="form-group">
                        <label class="text-center text-white" for="todoInput">Enter Your Todo:</label>
                        <input type="text" class="form-control" id="todoInput" required placeholder="">
                    </div>
                    <button id="addTodoBtn" class="btn btn-info btn-sm btn-block">Add todo</button>
                    <button id="updateTodoBtn" type="button" class="btn btn-success btn-sm btn-block d-none ">Update
                        todo</button>
                </form>
            </div>
        </div>
    </div>
    <div class="row mt-5">
        <div class="col-md-6 offset-3" id="todoContainer">
            <div class="card">
                <div class="card-body">
                    <ul class="list-group">

                            <div>
                                <button class="btn btn-info btn-sm">EDIT</button>
                                <button class="btn btn-danger btn-sm">REMOVE</button>
                            </div>
                        </li> -->
                    </ul>
                </div>
            </div>
        </div>
    </div>
    
        <div class="spinner d-none" id="spinner">
            <div class="spinner-border text-primary" role="status">
                <span class="sr-only">Loading...</span>
            </div>
        </div>
</body>
